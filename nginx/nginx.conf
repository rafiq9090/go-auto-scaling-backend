events {}

http {
    upstream app_server {
        server api1:8080;
        server api2:8080;
        server api3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://go_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}